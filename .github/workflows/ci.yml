name: ci

on:
  # Pushes to main only, not to every branch. A pull request already
  # triggers the pull_request event, so an unqualified `push:` ran both
  # jobs twice for every commit on a PR branch: a pull request opened
  # with two `web` and two `e2e` runs for one push.
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Rebase landing puts every commit on main, and `web` lints and builds only
  # the head. A commit that does not build costs a `git bisect` its whole range,
  # so each one before the head is linted and built here; a red test in one costs
  # a single step, so tests are not run. One `npm ci`, repeated only for a commit
  # whose `package-lock.json` differs. A pull request of one commit passes.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Every commit before the head lints and builds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shas < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | grep -vx "$HEAD_SHA" || true)
          echo "${#shas[@]} commit(s) besides the head"
          installed=""
          for sha in "${shas[@]}"; do
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            lock=$(git rev-parse "$sha:package-lock.json")
            if [ "$lock" != "$installed" ]; then
              npm ci
              installed="$lock"
            fi
            npm run lint
            npm run build
            echo "::endgroup::"
          done

  # The production tree at `high` and the whole tree at every severity, in a job of its
  # own, and `npm ci` must print no `npm warn deprecated`: docs/client-architecture.md §14
  # owns the argument and how a finding closes. An `ALLOWED` row is
  # `<GHSA id> <YYYY-MM-DD expiry> <reason>`. `npm audit` failing to answer is not a clean
  # tree, so a document with no `metadata` fails the job.
  audit:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 10
    env:
      ALLOWED: |
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install, refusing a deprecated package
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log
          if grep 'npm warn deprecated' npm-ci.log; then
            echo "::error::npm ci installed a deprecated package - override it in package.json"
            exit 1
          fi
      - name: Audit production dependencies at high, and the whole tree at any severity
        run: |
          npm audit --omit=dev --json > audit.json || true
          npm audit --json > full.json || true
          for doc in audit.json full.json; do
            jq -e '.metadata' "$doc" > /dev/null || { echo "::error::npm audit gave no answer"; cat "$doc"; exit 1; }
          done
          today=$(date -u +%F)
          found=$({
            jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | (.url | split("/") | last) + "\t" + .title] | unique[]' audit.json
            jq -r '[.vulnerabilities[].via[] | objects | (.url | split("/") | last) + "\t" + .title] | unique[]' full.json
          } | sort -u)
          failed=0
          while IFS=$'\t' read -r id title; do
            [ -n "$id" ] || continue
            row=$(printf '%s\n' "$ALLOWED" | grep "^$id " || true)
            expiry=$(printf '%s' "$row" | cut -d' ' -f2)
            if [ -n "$expiry" ] && [[ ! "$today" > "$expiry" ]]; then
              echo "::warning::$id allowed until $expiry: $title"
            else
              echo "::error::$id ($title)${expiry:+ - the allowance expired on $expiry}"
              failed=1
            fi
          done <<< "$found"
          while read -r id _; do
            [ -n "$id" ] || continue
            printf '%s\n' "$found" | grep -q "^$id"$'\t' || echo "::warning::$id is allowed but no longer reported - delete its row"
          done <<< "$ALLOWED"
          exit "$failed"

  e2e:
    runs-on: ubuntu-latest
    # Pulls the platform's images from the backend's registry, at the tag that follows each
    # image's newest signed build (blueprint-backend ADR-134), and builds only the broker, so
    # an unpublished backend change is not under test. `up --wait` hangs on anything that
    # never turns healthy, and six hours of that is a result nobody reads: the limit is
    # several times a cold build, so it only ever fires on something stuck.
    timeout-minutes: 45
    env:
      BLUEPRINT_REGISTRY: ghcr.io/alexander-shamray/blueprint-backend
      BLUEPRINT_TAG: main
    # Needs Docker and the backend checkout. Not continue-on-error: a smoke
    # that is allowed to fail is a smoke nobody reads.
    steps:
      - uses: actions/checkout@v7
      # The backend is a separate public repository. If it is ever made
      # private this step needs a token with read access to it; the failure
      # mode is a checkout 404, which reads like a wrong repository name.
      - uses: actions/checkout@v7
        with:
          repository: alexander-shamray/blueprint-backend
          path: blueprint-backend
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      # The recipe is the backend's own (docs/backend-architecture/
      # 14-local-development.md): pull what is published, build the one
      # image that is not, and start without building anything else. If the
      # packages are ever made private, `pull` fails with "denied" and this
      # step needs a docker/login-action for ghcr.io before it.
      - name: Start the platform
        working-directory: blueprint-backend
        run: |
          compose=deploy/compose/docker-compose.yml
          docker compose -f "$compose" pull --quiet
          docker compose -f "$compose" build rabbitmq
          docker compose -f "$compose" up -d --wait --no-build

      - name: Wait for the gateway
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5000/health/ready && exit 0
            sleep 5
          done
          echo "The gateway never became ready." >&2
          exit 1

      - run: npm run e2e

      - if: always()
        working-directory: blueprint-backend
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color > ../compose.log

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics
          path: |
            compose.log
            test-results/

  # The harness's own suite: docs/client-architecture.md §14 owns why it runs here, why on
  # this matrix and why on Python 3.12, and docs/testing.md what it needs. `setUpModule` fails
  # rather than skips when a tool is missing, since a skip on a missing tool reports a pass.
  # Each leg takes a runner and the legs run concurrently; how long each takes is for the
  # run's job timings to report (`docs/change-locality.md` §2).
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # `setUpModule` FAILS rather than skips on a missing tool, so jq has to
      # be present on every runner rather than only where it happens to ship.
      # It is on the ubuntu image already; the other two need a line.
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      - name: The whole suite
        shell: bash
        run: python -m unittest discover -s .claude/scripts -p 'test_*.py' -v

  # The issue form under .github/ISSUE_TEMPLATE against the vocabularies it
  # mirrors and the labels its answers name; .github/issue-form-gate/README.md
  # owns the claim. The labels are the one input read over the network, so
  # the token reads the checkout and the issues, and nothing more.
  issue-form:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the issue-form gate
        working-directory: .github/issue-form-gate
        run: python -m unittest
      - name: Every issue-form choice is its owner's word and a label here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name |
            python .github/issue-form-gate/issue_form_gate.py

  # Every gate suite under .github/, on a push to main too: a gate's own workflow runs its suite on
  # a pull request alone, and a gate with no workflow would otherwise run nowhere. The loop finds
  # the directories, so a suite a sync adds is covered with no line here, and finding none fails.
  # Each suite runs from its own directory, as those workflows run it.
  gates:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the gates
        run: |
          set -uo pipefail
          ran=0 failed=0
          for dir in .github/*/; do
            compgen -G "${dir}test_*.py" > /dev/null || continue
            echo "::group::${dir%/}"
            (cd "$dir" && python -m unittest) || failed=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then echo "no gate suite found under .github/" >&2; exit 1; fi
          exit "$failed"
      - name: Every plan written after the planning rule is under its size
        run: python .github/plan-size-gate/plan_size_gate.py

  # actionlint reads what the text gates do not: expression syntax, step-output references, action
  # input names and, through the runner's shellcheck, the shell in a `run:` block;
  # .github/workflow-lint/README.md owns the claim. The binary is pinned by version and checked
  # against its release's published digest, so the download is the one that was read.
  workflow-lint:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      # A lint that passes every workflow says nothing until it has been seen
      # to fail one. The fixture reads a step that does not exist, and the
      # message is matched so a failure for another reason does not count.
      - name: The linter fails a broken reference
        run: |
          if ./actionlint .github/workflow-lint/broken-reference.yml > fixture.out; then
            echo "actionlint passed the broken fixture"
            exit 1
          fi
          grep -F 'property "absent" is not defined' fixture.out
      - name: Lint every workflow
        run: ./actionlint

  # Spec §8 step 3. The Android project is committed, not generated here, so
  # this job compiles the same manifest a developer edits — a job that ran
  # `cap add android` first would rebuild the project from the template every
  # time and quietly drop the blueprint:// intent filter, which is the one
  # part of it that is not generated.
  android:
    # Pinned because this job depends on the IMAGE and not just on Linux: it uses the
    # Android SDK the runner ships (variables.gradle compiles against android-36) instead of
    # installing one, and `ubuntu-latest` is a moving label, so an image migration could drop
    # that platform with no change to the project. Bumping this pin is a deliberate act with
    # one thing to re-check.
    runs-on: ubuntu-24.04
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # The emulator relaxations are gated in capacitor.config.ts, and no unit test sees them:
      # both keys land in files `cap sync` generates. `npm_lifecycle_event` matches a script
      # NAME, so a rename would silently break every documented command while a check setting
      # only the variable stayed green. So this step runs the real command with
      # BLUEPRINT_EMULATOR pinned to '0', and is the only `--configuration android` build.
      - name: The documented emulator command asks for cleartext and mixed content
        env:
          BLUEPRINT_EMULATOR: '0'
        run: |
          npm run emulator:android
          grep -q 'usesCleartextTraffic="true"' android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml \
            || { echo 'npm run emulator:android did not enable cleartext traffic.' >&2; exit 1; }
          grep -q '"allowMixedContent": true' android/app/src/main/assets/capacitor.config.json \
            || { echo 'npm run emulator:android did not allow mixed content.' >&2; exit 1; }
      - name: So does the BLUEPRINT_EMULATOR variable on its own
        env:
          BLUEPRINT_EMULATOR: '1'
        run: |
          npx cap sync android
          grep -q 'usesCleartextTraffic="true"' android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml \
            || { echo 'BLUEPRINT_EMULATOR=1 did not enable cleartext traffic.' >&2; exit 1; }
          grep -q '"allowMixedContent": true' android/app/src/main/assets/capacitor.config.json \
            || { echo 'BLUEPRINT_EMULATOR=1 did not allow mixed content.' >&2; exit 1; }
      # `sync` after `build`, always: it copies dist into the gitignored
      # android/app/src/main/assets/public, so the checkout has no web assets until it runs.
      # This pair must also be the LAST build and sync before gradle: the emulator step above
      # leaves dist/ carrying environment.android.ts, so the APK would otherwise be assembled
      # from a bundle pointing at 10.0.2.2, green and not the artefact this job says it makes.
      - run: npm run build
      - run: npx cap sync android
      # The direction that matters: an APK that shipped cleartext would pass
      # every other check in this file.
      - name: The release sync asks for neither
        run: |
          if grep -q usesCleartextTraffic android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml; then
            echo 'A release sync enabled cleartext traffic.' >&2
            exit 1
          fi
          if grep -q allowMixedContent android/app/src/main/assets/capacitor.config.json; then
            echo 'A release sync allowed mixed content.' >&2
            exit 1
          fi
      - run: ./gradlew assembleDebug
        working-directory: android

  # Spec §8 step 4, and a CONFIGURATION check only: `cap sync ios` copies web
  # assets and writes Package.swift and capacitor.config.json. It does not
  # compile Swift, so it catches a plugin that is missing from the iOS project
  # or a config that no longer parses, and nothing about whether the app
  # builds. The compile is ios-build, below.
  ios-config:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

  # An unsigned simulator build: it compiles the Swift and nothing more. No
  # signing, no device and no secrets, and it does not launch the app, which
  # would be a separate piece of work. The repository is public, so the macOS
  # minutes are free.
  ios-build:
    # Pinned, not macos-latest: this job claims a compile against an Xcode
    # and a simulator SDK, and a moving label can change both with no change
    # to the project. Bumping the pin is a deliberate act with one thing to
    # re-check: that the build still succeeds.
    runs-on: macos-15
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # -project, not -workspace: Capacitor 8 generates a Swift Package
      # Manager project (ios/App/CapApp-SPM plus Package.swift) and there is
      # no App.xcworkspace to point at. A -workspace invocation fails with
      # "does not exist" rather than with anything about Swift.
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  # A pull request is not tested against the newest main before it lands
  # (docs/change-locality.md §6), so two that pass apart can fail together, and the run that shows
  # it is a push nobody may be watching. This opens one issue while main stays red, found by its
  # title, and comments on it for each further red run; it is closed by hand once main is green.
  # `commits` is not in `needs` because it never runs on a push.
  main-red:
    needs:
      [web, audit, e2e, gates, workflow-lint, harness, issue-form, android, ios-config, ios-build]
    # A job that hits its timeout or that no runner picks up reports `cancelled`, and `failure()`
    # is false for that. No `concurrency` block cancels a run here, so the one false alarm is
    # somebody's own cancel.
    if: >-
      always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='main is red: ci'
          open=$(gh issue list --state open --label bug --limit 1000 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again at $GITHUB_SHA: $RUN_URL"
          else
            printf '%s\n' \
              "The \`ci\` run on a push to \`main\` did not pass at $GITHUB_SHA: $RUN_URL" \
              '' \
              '## Severity' \
              '' \
              'high' \
              '' \
              'Revert the pull request that turned it red first, then fix forward' \
              '(docs/change-locality.md §6). Close this issue once main is green.' \
              '' \
              'Filed by the main-red job in ci.yml, not by hand or by a sweep.' |
              gh issue create --title "$title" --label bug --label high --body-file -
          fi
