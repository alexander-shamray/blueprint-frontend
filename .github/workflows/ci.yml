name: ci

on:
  # Pushes to main only, not to every branch. A pull request already
  # triggers the pull_request event, so an unqualified `push:` ran both
  # jobs twice for every commit on a PR branch - observed on PR #1, which
  # opened with two `web` and two `e2e` runs for one push.
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Rebase landing puts every commit on main, and `web` lints and builds only
  # the head. A commit that does not build costs a `git bisect` its whole
  # range, so each one before the head is linted and built here; a red test in
  # one costs a single step, so tests are not run (nor Playwright, nor the
  # native jobs). One `npm ci`, repeated only for a commit whose
  # `package-lock.json` differs from the last one installed. A pull request of
  # one commit has nothing to build and passes (#207).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Every commit before the head lints and builds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shas < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | grep -vx "$HEAD_SHA" || true)
          echo "${#shas[@]} commit(s) besides the head"
          installed=""
          for sha in "${shas[@]}"; do
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            lock=$(git rev-parse "$sha:package-lock.json")
            if [ "$lock" != "$installed" ]; then
              npm ci
              installed="$lock"
            fi
            npm run lint
            npm run build
            echo "::endgroup::"
          done

  # The production dependency tree, audited at `high` (#90). Its own job so a
  # new advisory fails one job with one meaning and not `web`. Every pin is
  # exact, so a finding is closed by a deliberate bump with `package-lock.json`
  # in the same commit - never `npm audit fix`, never `npm install`.
  #
  # An advisory with no fixed version, or one whose path this client does not
  # have, is allowed by id with an EXPIRY and a reason in `ALLOWED` below, not
  # by disabling the job: an expired row fails again, and a row whose advisory
  # has gone is reported so it gets deleted. Each row is
  # `<GHSA id> <YYYY-MM-DD expiry> <reason>`.
  #
  # `npm audit` failing to answer (a registry outage) is not a clean tree, so
  # a document with no `metadata` fails the job rather than passing it.
  audit:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 10
    env:
      ALLOWED: |
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit.json || true
          jq -e '.metadata' audit.json > /dev/null || { echo "::error::npm audit gave no answer"; cat audit.json; exit 1; }
          today=$(date -u +%F)
          found=$(jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | (.url | split("/") | last) + "\t" + .title] | unique[]' audit.json)
          failed=0
          while IFS=$'\t' read -r id title; do
            [ -n "$id" ] || continue
            row=$(printf '%s\n' "$ALLOWED" | grep "^$id " || true)
            expiry=$(printf '%s' "$row" | cut -d' ' -f2)
            if [ -n "$expiry" ] && [[ ! "$today" > "$expiry" ]]; then
              echo "::warning::$id allowed until $expiry: $title"
            else
              echo "::error::$id ($title)${expiry:+ - the allowance expired on $expiry}"
              failed=1
            fi
          done <<< "$found"
          while read -r id _; do
            [ -n "$id" ] || continue
            printf '%s\n' "$found" | grep -q "^$id"$'\t' || echo "::warning::$id is allowed but no longer reported - delete its row"
          done <<< "$ALLOWED"
          exit "$failed"

  e2e:
    runs-on: ubuntu-latest
    # The platform's images are pulled from the registry the backend
    # publishes them to, at the tag that follows each image's newest signed
    # build (blueprint-backend ADR-134), instead of being compiled on the
    # runner. Only the broker is still built here. So a backend change that
    # has not been published yet is not under test in this job. `up --wait`
    # blocks until every health check passes, so anything that never becomes
    # healthy hangs here rather than failing. Without a limit that hang runs
    # to the six-hour job default, holding a runner for a result nobody is
    # going to read. The limit is several times a cold build, so it cannot
    # trip on a slow start; it only ever fires on something stuck.
    timeout-minutes: 45
    env:
      BLUEPRINT_REGISTRY: ghcr.io/alexander-shamray/blueprint-backend
      BLUEPRINT_TAG: main
    # Needs Docker and the backend checkout. Not continue-on-error: a smoke
    # that is allowed to fail is a smoke nobody reads.
    steps:
      - uses: actions/checkout@v4
      # The backend is a separate public repository. If it is ever made
      # private this step needs a token with read access to it; the failure
      # mode is a checkout 404, which reads like a wrong repository name.
      - uses: actions/checkout@v4
        with:
          repository: alexander-shamray/blueprint-backend
          path: blueprint-backend
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      # The recipe is the backend's own (docs/backend-architecture/
      # 14-local-development.md): pull what is published, build the one
      # image that is not, and start without building anything else. If the
      # packages are ever made private, `pull` fails with "denied" and this
      # step needs a docker/login-action for ghcr.io before it.
      - name: Start the platform
        working-directory: blueprint-backend
        run: |
          compose=deploy/compose/docker-compose.yml
          docker compose -f "$compose" pull --quiet
          docker compose -f "$compose" build rabbitmq
          docker compose -f "$compose" up -d --wait --no-build

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5000/health/ready && exit 0
            sleep 5
          done
          echo "The gateway never became ready." >&2
          exit 1

      - run: npm run e2e

      - if: always()
        working-directory: blueprint-backend
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color > ../compose.log

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            compose.log
            test-results/

  # The harness's own suite, and it is here because three files in `.claude/`
  # argued from a premise this repository did not make true. `/review-grok`,
  # archived since under the tag `archive/external-reviewers`, said the
  # tracked-symlink premise was "still gated" because "the helper suite
  # fails on any mode 120000 in `git ls-files -s` on every push" — which was a
  # statement about the repository this harness came from. Nothing here ran it,
  # so a premise offered as defence in depth was resting on a gate that did not
  # exist. Copilot's seventh round on PR #13 found the neighbouring overclaims;
  # this one was found by sweeping for the same class.
  #
  # It needs no Node and no Docker. What it does need is bash,
  # grep, git and jq, and `setUpModule` FAILS rather than skips when one is
  # missing — a skip on a missing tool reports a pass, which is the fail-open
  # this suite exists to refuse.
  #
  # Python is pinned to 3.12 because that is what the two PreToolUse hooks are
  # invoked as in `.claude/settings.json`; running the suite on a different
  # interpreter would verify something other than what a developer runs.
  # **The matrix is not thoroughness, it is the module's own claim.**
  # `test_edit_target_guard.py` says "CI runs this module on Linux, Windows
  # and macOS for exactly that reason", and the reason is that it asserts
  # three PLATFORM properties rather than assuming them: how `..` resolves
  # after a link, which POSIX does against the target and Windows collapses
  # first; whether the filesystem folds case, which is the mount's answer and
  # not the platform's; and which link primitives exist at all. A single
  # ubuntu runner would leave the Windows junction path and the macOS
  # case-insensitive path unexercised while the docstring claimed otherwise —
  # a stated coverage nothing enforces, which is the failure this repository
  # ranks critical. Raised by Copilot against PR #13 round 8, against the job
  # added in round 7. Each leg occupies a runner of its own, but the legs run
  # concurrently, so one adds wall clock only when it is the last job in the
  # run to finish. How long each takes is for the run's job timings to report,
  # not this comment (`docs/change-locality.md` §2).
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `setUpModule` FAILS rather than skips on a missing tool, so jq has to
      # be present on every runner rather than only where it happens to ship.
      # It is on the ubuntu image already; the other two need a line.
      - if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - if: runner.os == 'macOS'
        run: brew install jq
      - name: The suite reads `git ls-files`, so the checkout must be a real one
        run: git rev-parse --is-inside-work-tree
      - run: python -m unittest discover -s .claude/scripts -p 'test_*.py' -v

  # Spec §8 step 3. The Android project is committed, not generated here, so
  # this job compiles the same manifest a developer edits — a job that ran
  # `cap add android` first would rebuild the project from the template every
  # time and quietly drop the blueprint:// intent filter, which is the one
  # part of it that is not generated.
  android:
    # Pinned, unlike the other three jobs, because this one has a dependency
    # on the IMAGE and not just on Linux: it uses the Android SDK the runner
    # ships (variables.gradle compiles against android-36) instead of
    # installing one. `ubuntu-latest` is a moving label, so a future image
    # migration could drop that platform and break this build with no change
    # to the project. Bumping this pin is a deliberate act with one thing to
    # re-check.
    runs-on: ubuntu-24.04
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # The emulator relaxations (#7) are gated in capacitor.config.ts, and
      # three things about that gate are worth asserting here. None of them is
      # observable from a unit test: both keys leave the TypeScript and land in
      # files `cap sync` generates.
      #
      # The gate has TWO selectors and they are not equally safe. The
      # BLUEPRINT_EMULATOR variable is explicit. `npm_lifecycle_event` is a
      # match on a script NAME, so renaming that script in package.json — or
      # npm changing what it exports — would silently break every command the
      # README, §15 and the plan give, while a check that only set the variable
      # stayed green. So the first step runs the real documented command with
      # BLUEPRINT_EMULATOR pinned to '0', which means a pass can only have come
      # from the lifecycle selector. It is also the only place anything builds
      # `--configuration android`.
      - name: The documented emulator command asks for cleartext and mixed content
        env:
          BLUEPRINT_EMULATOR: '0'
        run: |
          npm run emulator:android
          grep -q 'usesCleartextTraffic="true"' android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml \
            || { echo 'npm run emulator:android did not enable cleartext traffic.' >&2; exit 1; }
          grep -q '"allowMixedContent": true' android/app/src/main/assets/capacitor.config.json \
            || { echo 'npm run emulator:android did not allow mixed content.' >&2; exit 1; }
      - name: So does the BLUEPRINT_EMULATOR variable on its own
        env:
          BLUEPRINT_EMULATOR: '1'
        run: |
          npx cap sync android
          grep -q 'usesCleartextTraffic="true"' android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml \
            || { echo 'BLUEPRINT_EMULATOR=1 did not enable cleartext traffic.' >&2; exit 1; }
          grep -q '"allowMixedContent": true' android/app/src/main/assets/capacitor.config.json \
            || { echo 'BLUEPRINT_EMULATOR=1 did not allow mixed content.' >&2; exit 1; }
      # `sync` after `build`, always: it is what copies dist into
      # android/app/src/main/assets/public, and that directory is gitignored,
      # so the checkout has no web assets in it at all until this runs.
      #
      # This pair also has to be the LAST build and sync before gradle. The
      # emulator step above leaves dist/ carrying environment.android.ts, so
      # without rebuilding here the APK would be assembled from a bundle
      # pointing at 10.0.2.2 — green, and not the artefact this job says it
      # produces.
      - run: npm run build
      - run: npx cap sync android
      # The direction that matters: an APK that shipped cleartext would pass
      # every other check in this file.
      - name: The release sync asks for neither
        run: |
          if grep -q usesCleartextTraffic android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml; then
            echo 'A release sync enabled cleartext traffic.' >&2
            exit 1
          fi
          if grep -q allowMixedContent android/app/src/main/assets/capacitor.config.json; then
            echo 'A release sync allowed mixed content.' >&2
            exit 1
          fi
      - run: ./gradlew assembleDebug
        working-directory: android

  # Spec §8 step 4, and a CONFIGURATION check only: `cap sync ios` copies web
  # assets and writes Package.swift and capacitor.config.json. It does not
  # compile Swift, so it catches a plugin that is missing from the iOS project
  # or a config that no longer parses, and nothing about whether the app
  # builds. The compile lives in the disabled job below; enabling it is one
  # line and costs a macOS runner minute per push, which is why it is off
  # rather than an oversight.
  ios-config:
    runs-on: ubuntu-latest
    # Bounds a step that never exits, which would otherwise hold the runner
    # for GitHub's default limit (docs/testing.md). Headroom over the usual
    # run, not a duration.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

  # ios-build:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version-file: .nvmrc, cache: npm }
  #     - run: npm ci && npm run build && npx cap sync ios
  #     # -project, not -workspace: Capacitor 8 generates a Swift Package
  #     # Manager project (ios/App/CapApp-SPM plus Package.swift) and there is
  #     # no App.xcworkspace to point at. A -workspace invocation fails with
  #     # "does not exist" rather than with anything about Swift.
  #     - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator build
