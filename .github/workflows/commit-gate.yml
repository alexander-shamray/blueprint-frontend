name: Commit gate

# Rebase landing leaves no merge commit to name the pull request, so each
# commit carries it as a trailer. `.github/commit-gate/README.md` owns the
# rules; this file only runs them. No `edited` trigger: a body edit changes
# no commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The range is base..head and the enforcing copy is read from the
          # base commit, so history is needed.
          fetch-depth: 0

      # Dependabot's own pull requests carry no PR trailer, so the gate stands
      # down for one that Dependabot opened and whose every commit Dependabot
      # made, and runs for any commit made elsewhere: docs/change-locality.md
      # section 6. The commits decide, by author and committer together. Who
      # opened the pull request does not say who pushed to it, and a local
      # amend or rebase keeps Dependabot as the author but makes the human the
      # committer, where Dependabot's own commits and rebases have GitHub's.
      # This is blueprint-admin#482's form, written after blueprint-admin#400
      # found that checking the opener alone let a human push through.
      - name: Decide whether this is Dependabot's own pull request
        id: dependabot
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDABOT: 49699333+dependabot[bot]@users.noreply.github.com noreply@github.com
        run: |
          set -euo pipefail
          own=false
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            makers=$(git log --format='%ae %ce' "$BASE_SHA..$HEAD_SHA")
            if [ -n "$makers" ] && ! grep -qvxF "$DEPENDABOT" <<<"$makers"; then
              own=true
            fi
          fi
          echo "own=$own" >> "$GITHUB_OUTPUT"
          if [ "$own" = true ]; then
            echo "::notice::every commit in this pull request is Dependabot's; the gate stands down"
          fi

      - uses: actions/setup-python@v5
        if: steps.dependabot.outputs.own != 'true'
        with:
          python-version: '3.12'

      - name: Test the proposed gate
        if: steps.dependabot.outputs.own != 'true'
        working-directory: .github/commit-gate
        run: python -m unittest

      # The base copy judges, so a pull request cannot supply its own judge.
      # The one difference is the pull request that introduces the gate: its
      # base carries none, so it is judged by its own copy, with a notice. A
      # base that predates the gate while the head also lacks it still fails.
      - name: Take the enforcing gate from the base commit
        if: steps.dependabot.outputs.own != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE: .github/commit-gate/commit_gate.py
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commit-gate"
          if git cat-file -e "$BASE_SHA:$GATE" 2>/dev/null; then
            git show "$BASE_SHA:$GATE" > "$RUNNER_TEMP/commit-gate/commit_gate.py"
            echo "enforcing with the gate as of $BASE_SHA"
          elif [ -f "$GATE" ]; then
            cp "$GATE" "$RUNNER_TEMP/commit-gate/commit_gate.py"
            echo "::notice::the base carries no gate; this pull request introduces it and is judged by its own copy"
          else
            echo "::error::neither $BASE_SHA nor the head carries $GATE"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/commit-gate/commit_gate.py" ]; then
            echo "::error::the enforcing gate is empty"
            exit 1
          fi

      - name: Every commit names this pull request and keeps the form
        if: steps.dependabot.outputs.own != 'true'
        shell: bash
        run: |
          python "$RUNNER_TEMP/commit-gate/commit_gate.py" \
            --pr "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
