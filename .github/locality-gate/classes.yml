# The class -> tree-set map of docs/change-locality.md section 3, held once.
#
# This file is the owner of which paths each change class may touch. The
# contract's table states each class's rule in words and cites this file for
# the paths. No gate in CI reads it here: the locality gate was not ported
# (section 3 says so), and .claude/scripts/pr-locality.sh, which /review-branch
# and /ship run against an open pull request, is its one reader.
#
# The grammar is the one pr-locality.sh accepts and nothing else: a comment or
# blank line; a class line, one capital letter A to E and a colon; an item
# line, two spaces, a dash, a space and one single-quoted path token. Every
# class appears once and carries at least one item. A token is a
# repository-relative path or glob: `**` crosses directories, `*` and `?` do
# not, `{a,b}` is an alternation, and a token also covers everything beneath
# the directory it names.
#
# The map is deliberately coarse. It says what a class may reach in this
# repository, not "one feature slice" or "one core area", which is a property
# of the change: the PR body's `| Touch set |` row is the sharper check.

# A -- local. One feature slice, its specs, and the one e2e step.
A:
  - 'src/app/features/**'
  - 'e2e/**'

# B -- shared mechanism. One core area or shared component, the one feature
# spec that proves the wiring, and the one paragraph stating the rule.
B:
  - 'src/app/core/**'
  - 'src/app/shared/**'
  - 'src/app/features/**'
  - 'docs/client-architecture.md'

# C -- a rule moved. Code and specs, one client-architecture section, and the
# spec section it amends.
C:
  - 'src/**'
  - 'docs/client-architecture.md'
  - 'docs/superpowers/specs/**'

# D -- docs or harness. The documents, the harness and its sync record, CI,
# the native projects, e2e, tools, and the root configuration files.
D:
  - 'docs/**'
  - '.claude/**'
  - '.harness/**'
  - '.github/**'
  - '.vscode/**'
  - 'android/**'
  - 'ios/**'
  - 'e2e/**'
  - 'tools/**'
  - 'CLAUDE.md'
  - 'AGENTS.md'
  - 'README.md'
  - '.editorconfig'
  - '.gitattributes'
  - '.gitignore'
  - '.codeindexignore'
  - '.mcp.json'
  - '.nvmrc'
  - '.prettierrc'
  - 'capacitor.config.ts'
  - 'eslint.config.js'
  - 'ionic.config.json'
  - 'playwright.config.ts'

# E -- dependency graph. The manifest and lockfile together, the build
# configuration a path alias or a budget lives in, and the spec's section 11
# and the plan's Versions table, where the version is the decision.
E:
  - 'package.json'
  - 'package-lock.json'
  - 'angular.json'
  - 'tsconfig.json'
  - 'tsconfig.app.json'
  - 'tsconfig.spec.json'
  - 'docs/superpowers/specs/**'
  - 'docs/superpowers/plans/**'
