# The class -> tree-set map of docs/change-locality.md section 3, held once.
#
# .claude/scripts/pr-locality.sh gives the verdict from it, and refuses a line or
# token outside the grammar it reads; test_class_map_frontend.py holds it against
# the tree.

# A -- local. One feature slice, its specs, and the one e2e step.
A:
  - 'src/app/features/**'
  - 'e2e/**'

# B -- shared mechanism. One core area or shared component, the one feature
# spec that proves the wiring, the one paragraph stating the rule, and the
# silent-refresh page, the auth mechanism's other half.
B:
  - 'src/app/core/**'
  - 'src/app/shared/**'
  - 'src/app/features/**'
  - 'public/**'
  - 'docs/client-architecture.md'

# C -- a rule moved. Code and specs, one client-architecture section, and the
# spec section it amends.
C:
  - 'src/**'
  - 'docs/client-architecture.md'
  - 'docs/superpowers/specs/**'

# D -- docs or harness. The documents, the harness and its sync record, CI,
# the native projects, the web assets, e2e, tools, and the root configuration
# files.
D:
  - 'docs/**'
  - '.claude/**'
  - '.harness/**'
  - '.github/**'
  - '.vscode/**'
  - 'android/**'
  - 'ios/**'
  - 'public/**'
  - 'e2e/**'
  - 'tools/**'
  - 'CLAUDE.md'
  - 'AGENTS.md'
  - 'README.md'
  - '.editorconfig'
  - '.gitattributes'
  - '.gitignore'
  - '.codeindexignore'
  - '.mcp.json'
  - '.nvmrc'
  - '.prettierrc'
  - 'capacitor.config.ts'
  - 'eslint.config.js'
  - 'ionic.config.json'
  - 'playwright.config.ts'

# E -- dependency graph. The manifest and lockfile together, the build
# configuration a path alias or a budget lives in, and the spec's section 11
# and the plan's Versions table, where the version is the decision.
E:
  - 'package.json'
  - 'package-lock.json'
  - 'angular.json'
  - 'tsconfig.json'
  - 'tsconfig.app.json'
  - 'tsconfig.spec.json'
  - 'docs/superpowers/specs/**'
  - 'docs/superpowers/plans/**'
